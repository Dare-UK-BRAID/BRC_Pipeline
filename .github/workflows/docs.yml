name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'BRC_structural_pipeline/docs/**'
      - 'BRC_structural_pipeline/mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build and deploy docs
        working-directory: BRC_structural_pipeline
        run: mkdocs gh-deploy --force
