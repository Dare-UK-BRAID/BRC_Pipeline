site_name: BRAID Neuroimaging Pipelines
site_description: Technical documentation for the BRAID neuroimaging preprocessing pipelines (structural, diffusion, functional, perfusion, group analysis, IDP extraction)
site_author: Ali-Reza Mohammadi-Nejad & Stamatios N Sotiropoulos
site_url: https://github.com/BRC_Pipeline
repo_url: https://github.com/BRC_Pipeline
repo_name: BRC_Pipeline
docs_dir: docs

theme:
  name: material
  logo: assets/BRAID_logo.svg
  favicon: assets/BRAID_logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

extra_css:
  - stylesheets/braid.css

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md

  - Structural Pipeline:
    - Overview: pipeline/overview.md
    - Directory Structure: pipeline/directory-structure.md
    - Dependencies: pipeline/dependencies.md
    - Script Reference:
      - scripts/index.md
      - Entry Point:
        - scripts/struc-preproc.md
        - scripts/struc-preproc-part1.md
        - scripts/struc-preproc-part2.md
        - scripts/struc-preproc-part3.md
      - Core Processing:
        - scripts/t1-preprocessing.md
        - scripts/t2-preprocessing.md
      - Analysis Tools:
        - scripts/t1-sienax.md
        - scripts/t2-bianca.md
      - Organisation:
        - scripts/output-organization.md
        - scripts/fsl-anat.md
        - scripts/run-preprocessing.md
        - scripts/move-rename.md
    - Appendix:
      - appendix/call-graph.md
      - appendix/environment-variables.md
      - appendix/output-files.md

  - Diffusion Pipeline:
    - diffusion/index.md

  - Functional Pipeline:
    - functional/index.md

  - Functional Group Analysis:
    - func-group/index.md

  - Perfusion (ASL) Pipeline:
    - perfusion/index.md

  - IDP Extraction:
    - idp/index.md
